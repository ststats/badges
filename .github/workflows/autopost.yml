name: 소주양 공지 자동 등록

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soju-ygosu-autopost
  cancel-in-progress: false

jobs:
  post:
    if: vars.AUTOPOST_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/autopost.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          YGOSU_ID: ${{ secrets.YGOSU_ID }}
          YGOSU_PASSWORD: ${{ secrets.YGOSU_PASSWORD }}
          SOOP_COOKIE: ${{ secrets.SOOP_COOKIE }}
          COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
