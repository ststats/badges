name: Build badges

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # GitHub 정기 실행은 몇십 분씩 밀리기도 하고, 저장소에 60일 동안 커밋이 없으면 꺼진다.
  # 제때 돌려야 하면 cron-job.org에서 workflow_dispatch를 부른다(README).
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: badges
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      # 데이터를 못 받으면 여기서 실패해 배포하지 않는다(이전 뱃지가 그대로 남는다)
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm run build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
