name: Build badges

on:
  workflow_dispatch:
    inputs:
      force:
        description: '바뀐 게 없어도 다시 만들기'
        type: boolean
        default: false
  push:
    branches:
      - main
  # 5분마다 새 글·날짜 변경을 확인하고, 바뀌었을 때만 찍어서 배포한다.
  # GitHub 정기 실행은 몇십 분씩 밀리기도 하므로 cron-job.org에서 workflow_dispatch를 불러도 된다(README).
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: badges
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.badges.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      # 데이터를 못 받으면 여기서 실패해 배포하지 않는다(이전 뱃지가 그대로 남는다)
      - id: pages
        uses: actions/configure-pages@v6
      - id: badges
        run: npm run build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          # 코드·일정을 올릴 때와 직접 '다시 만들기'를 고를 때는 늘 만든다
          FORCE: ${{ (github.event_name == 'push' || inputs.force) && '1' || '0' }}
      - if: steps.badges.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
