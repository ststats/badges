<!doctype html>
<html lang="ko">
<head>
<!--head:일정 편집-->
<style>
.toolbar { position: sticky; top: 51px; z-index: 10; background: rgba(250,250,250,.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(24,24,27,.06); }
.bar { max-width: 1160px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bar h1 { font-size: 20px; letter-spacing: -0.03em; margin: 0; flex: 1; min-width: 140px; display: flex; align-items: center; gap: 10px; }
.bar h1 img { width: 32px; height: 32px; border-radius: 32px; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(24,24,27,.15); }
.status { font-size: 13px; color: var(--sub); width: 100%; }
.status.err { color: var(--red); } .status.ok { color: var(--green); }
.cookie { width: 100%; font-size: 13px; font-weight: 600; border-radius: 12px; padding: 8px 12px; }
.cookie.warn { background: #fff4f4; color: var(--red); border: 1px solid #fcd5d5; }
.cookie a { color: inherit; }
main { max-width: 1160px; margin: 0 auto; padding: 20px 16px 64px; display: grid; grid-template-columns: minmax(0, 1fr) 640px; gap: 28px; align-items: start; }
@media (max-width: 1100px) { main { grid-template-columns: minmax(0, 1fr); } }
.week { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.week b { flex: 1; text-align: center; font-size: 16px; }
.day { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 10px; }
.day.today { box-shadow: 0 0 0 1.5px var(--ink), 0 8px 24px rgba(24,24,27,.06); }
.dh { display: flex; align-items: center; gap: 8px; }
.dh .d { font-weight: 800; font-size: 15px; flex: 1; }
.dh .d small { color: var(--sub); font-weight: 600; margin-left: 4px; }
.sun .d { color: var(--red); } .sat .d { color: var(--blue); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--sub); cursor: pointer; user-select: none; }
.toggle input { width: 16px; height: 16px; accent-color: var(--ink); }
.ev { display: flex; gap: 6px; margin-top: 8px; }
.ev input { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; background: #fff; min-width: 0; }
.ev input:focus, details input:focus { outline: 2px solid #c7d2fe; outline-offset: 0; border-color: transparent; }
.ev .t { width: 78px; flex: none; text-align: center; font-variant-numeric: tabular-nums; }
.ev .x { flex: 1; }
.ev input.bad { border-color: var(--red); background: #fff5f5; }
.ev .del { flex: none; width: 38px; border: 0; background: none; color: var(--faint); font-size: 20px; cursor: pointer; border-radius: 10px; }
.ev .del:hover { background: var(--tint); color: var(--ink); }
.add { margin-top: 8px; border: 1px dashed var(--line); background: none; border-radius: 10px; width: 100%; padding: 8px; color: var(--sub); font-weight: 600; cursor: pointer; }
.add:hover { border-color: var(--faint); color: var(--ink); }
.off .ev, .off .add { display: none; }
aside { position: sticky; top: 150px; }
@media (max-width: 1100px) { aside { position: static; } }
aside h2 { font-size: 14px; color: var(--sub); margin: 4px 0 10px; }
.preview { width: 100%; overflow: hidden; border-radius: 22px; }
.preview img { width: 100%; max-width: 628px; display: block; transition: opacity .15s; }
.preview img.busy { opacity: .5; }
details { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 14px; margin-top: 16px; }
summary { font-weight: 700; cursor: pointer; }
details input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; margin: 8px 0; }
@media (max-width: 700px) {
    .toolbar { position: static; backdrop-filter: none; -webkit-backdrop-filter: none; } /* 흐림이 있으면 fixed 저장 버튼이 막대 안에 갇힌다 */
    #save { position: fixed; right: 16px; bottom: 16px; z-index: 15; padding: 12px 22px; font-size: 15px; box-shadow: 0 8px 24px rgba(24,24,27,.25); }
    #save:disabled { opacity: 0; pointer-events: none; }
    .bar h1 { font-size: 18px; }
}
.msg { font-size: 13px; margin: 6px 0 0; } .msg.err { color: var(--red); } .msg.ok { color: var(--green); }
</style>
</head>
<body>
<!--topbar:edit-->
<div class="toolbar"><div class="bar">
  <h1><img id="avatar" alt="" hidden><span id="title">일정 편집</span></h1>
  <button class="btn" id="reload" type="button">다시 불러오기</button>
  <button class="btn primary" id="save" type="button" disabled>저장</button>
  <div class="status" id="status">불러오는 중…</div>
  <div class="cookie" id="cookie" hidden></div>
</div></div>
<main>
  <section>
    <div class="week">
      <button class="btn" id="prev" type="button">‹ 이전 주</button>
      <b id="range"></b>
      <button class="btn" id="next" type="button">다음 주 ›</button>
    </div>
    <div id="days"></div>
    <p class="hint">시간은 <b>20:00</b>처럼 적고, 모르면 <b>미정</b>, 비워 두면 시간 없이 나옵니다. 내용을 비운 줄은 저장할 때 빠집니다.
      뱃지에는 늘 <b>이번 주</b>만 나오니, 다음 주 일정은 미리 적어 두면 월요일에 저절로 바뀝니다.</p>
    <details id="pwBox">
      <summary>편집 비밀번호</summary>
      <p class="hint">저장할 때 쓰는 비밀번호예요(Vercel 환경 변수 <code>EDIT_PASSWORD</code>). 한 번 넣으면 이 브라우저에 기억돼요.</p>
      <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
      <button class="btn" id="pwCheck" type="button">확인</button>
      <button class="btn" id="forget" type="button">이 브라우저에서 지우기</button>
      <div class="msg" id="pwMsg"></div>
    </details>
  </section>
  <aside>
    <h2>미리보기</h2>
    <div class="preview" id="previewBox"><img id="preview" alt="뱃지 미리보기"></div>
  </aside>
</main>
<script type="module">
import { kstToday, mmdd, parseSchedule, serializeSchedule, shiftWeek, weekdayOf, weekSchedule } from '/lib.mjs';

// 읽기·저장은 서버(/api/save)가 하고, 저장은 편집 비밀번호를 확인한다. 미리보기도 서버가 실제 뱃지처럼 그린다.
const PW_KEY = 'badges-edit-password';
const $ = id => document.getElementById(id);
const config = await fetch('/config.json', { cache: 'no-store' }).then(r => r.json());
document.title = `${config.name} 일정 편집`;
$('title').textContent = `${config.name} 일정 편집`;
$('avatar').src = `https://profile.img.sooplive.com/LOGO/${config.soopId.slice(0, 2)}/${config.soopId}/m/${config.soopId}.webp`;
$('avatar').onload = () => { $('avatar').hidden = false; };

// 편집 비밀번호는 이 브라우저에만 기억한다
const savedPw = {
    get: () => { try { return localStorage.getItem(PW_KEY) || ''; } catch { return ''; } },
    set: v => { try { v ? localStorage.setItem(PW_KEY, v) : localStorage.removeItem(PW_KEY); } catch {} },
};
const pwMsg = (text, cls = '') => { $('pwMsg').textContent = text; $('pwMsg').className = `msg ${cls}`; };
$('pw').value = savedPw.get();
if (!savedPw.get()) $('pwBox').open = true;
$('pw').addEventListener('change', () => { savedPw.set($('pw').value); refreshButtons(); });
$('forget').addEventListener('click', () => { savedPw.set(''); $('pw').value = ''; pwMsg(''); refreshButtons(); });
$('pwCheck').addEventListener('click', async () => {
    savedPw.set($('pw').value);
    refreshButtons();
    try {
        await post({ file: 'check' });
        pwMsg('맞아요. 이제 저장할 수 있어요.', 'ok');
    } catch (e) {
        pwMsg(e.message, 'err');
    }
});

// 서버에 보내고 오류면 그 문구로 던진다
async function post(body) {
    const res = await fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: savedPw.get(), ...body }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `서버 ${res.status}`);
    return data;
}

let state = { events: [], offAir: new Set(), version: null };
let weekOffset = 0;
let dirty = false;
let loading = false;

const status = (text, cls = '') => { $('status').textContent = text; $('status').className = `status ${cls}`; };

async function load() {
    loading = true;
    refreshButtons();
    status('불러오는 중…');
    try {
        const res = await fetch('/api/save', { cache: 'no-store' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `서버 ${res.status}`);
        const parsed = parseSchedule(data.content || '', Date.now());
        state = { events: parsed.events, offAir: parsed.offAir, version: data.version };
        dirty = false;
        status(parsed.errors.length ? `불러옴. 읽지 못한 줄 ${parsed.errors.length}개는 저장하면 사라집니다: ${parsed.errors.join(' / ')}` : '불러왔습니다', parsed.errors.length ? 'err' : '');
    } catch (e) {
        status(`불러오지 못했습니다(${e.message}). 잠시 뒤 다시 불러오기를 눌러 주세요.`, 'err');
    } finally {
        loading = false;
        render();
    }
}

const normTime = raw => {
    const t = raw.trim();
    if (!t) return '';
    if (/^(시간)?미정$/.test(t)) return '시간미정';
    let m = /^(\d{1,2}):?(\d{2})$/.exec(t);
    if (m && Number(m[1]) <= 30 && Number(m[2]) < 60) return `${Number(m[1])}:${m[2]}`;
    m = /^(\d{1,2})시?$/.exec(t);
    if (m && Number(m[1]) <= 30) return `${Number(m[1])}:00`;
    return null;
};
const showTime = t => (t === '시간미정' ? '미정' : t);

const currentNow = () => shiftWeek(Date.now(), weekOffset);

function render() {
    const days = weekSchedule(state, currentNow());
    $('range').textContent = `${weekOffset === 0 ? '이번 주' : weekOffset === 1 ? '다음 주' : weekOffset === -1 ? '지난 주' : `${weekOffset > 0 ? '+' : ''}${weekOffset}주`} · ${mmdd(days[0].date)} – ${mmdd(days[6].date)}`;
    const today = kstToday(Date.now());
    const box = $('days');
    box.replaceChildren(
        ...days.map(day => {
            const wd = weekdayOf(day.date);
            const el = document.createElement('div');
            el.className = ['day', day.date === today && 'today', day.offAir && 'off', wd === '일' && 'sun', wd === '토' && 'sat'].filter(Boolean).join(' ');
            el.innerHTML = `<div class="dh"><span class="d">${wd}<small>${mmdd(day.date)}${day.date === today ? ' · 오늘' : ''}</small></span>
              <label class="toggle"><input type="checkbox"${day.offAir ? ' checked' : ''}> 휴방</label></div>`;
            el.querySelector('.toggle input').addEventListener('change', e => {
                e.target.checked ? state.offAir.add(day.date) : state.offAir.delete(day.date);
                changed(true);
            });
            for (const ev of day.events) el.append(eventRow(ev));
            const add = document.createElement('button');
            add.type = 'button';
            add.className = 'add';
            add.textContent = '+ 일정 추가';
            add.addEventListener('click', () => {
                const ev = { date: day.date, time: '', text: '', order: Date.now() };
                state.events.push(ev);
                const row = eventRow(ev);
                add.before(row);
                row.querySelector('.t').focus();
                changed(false);
            });
            el.append(add);
            return el;
        })
    );
    preview();
    refreshButtons();
}

function eventRow(ev) {
    const row = document.createElement('div');
    row.className = 'ev';
    row.innerHTML = `<input class="t" placeholder="20:00" inputmode="text" aria-label="시간"><input class="x" placeholder="내용" aria-label="내용"><button class="del" type="button" aria-label="삭제">×</button>`;
    const [t, x] = row.querySelectorAll('input');
    t.value = showTime(ev.time);
    x.value = ev.text;
    t.addEventListener('input', () => {
        const v = normTime(t.value);
        t.classList.toggle('bad', v === null);
        ev.time = v ?? ev.time;
        ev.bad = v === null;
        changed(false);
    });
    t.addEventListener('blur', () => { if (!ev.bad) t.value = showTime(ev.time); });
    x.addEventListener('input', () => { ev.text = x.value; changed(false); });
    row.querySelector('.del').addEventListener('click', () => {
        state.events = state.events.filter(e => e !== ev);
        row.remove();
        changed(false);
    });
    return row;
}

let previewTimer = 0;
function changed(rerender) {
    dirty = true;
    if (rerender) render();
    else {
        clearTimeout(previewTimer);
        previewTimer = setTimeout(preview, 250);
        refreshButtons();
    }
    status('저장하지 않은 변경이 있습니다');
}

function cleanState() {
    return { events: state.events.filter(e => String(e.text).trim()), offAir: state.offAir };
}

// 저장 전 일정을 서버에 보내 실제 뱃지와 같은 그림을 받는다(마지막 요청만 반영)
let previewSeq = 0;
let previewUrl = '';
async function preview() {
    const seq = ++previewSeq;
    $('preview').classList.add('busy');
    try {
        const res = await fetch('/api/preview', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: serializeSchedule(cleanState()), now: currentNow() }),
        });
        if (!res.ok || seq !== previewSeq) return;
        const url = URL.createObjectURL(await res.blob());
        if (seq !== previewSeq) return URL.revokeObjectURL(url);
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = url;
        $('preview').src = url;
    } catch {
        // 미리보기는 실패해도 편집은 계속된다
    } finally {
        if (seq === previewSeq) $('preview').classList.remove('busy');
    }
}

function refreshButtons() {
    const bad = state.events.some(e => e.bad);
    $('save').disabled = loading || !dirty || bad || !savedPw.get();
    $('save').title = !savedPw.get() ? '아래 "편집 비밀번호"를 먼저 넣어 주세요' : bad ? '빨간 시간 칸을 고쳐 주세요' : '';
}

$('save').addEventListener('click', async () => {
    $('save').disabled = true;
    status('저장 중…');
    try {
        const text = serializeSchedule(cleanState());
        const data = await post({ file: 'schedule', content: text, version: state.version });
        state.version = data.version;
        state.events = cleanState().events;
        dirty = false;
        render();
        status('저장했습니다. 뱃지에 바로 반영돼요(커뮤니티에서는 길어야 30초쯤).', 'ok');
    } catch (e) {
        status(`저장하지 못했습니다: ${e.message}`, 'err');
        refreshButtons();
    }
});
$('reload').addEventListener('click', () => {
    if (dirty && !confirm('저장하지 않은 변경을 버리고 다시 불러올까요?')) return;
    load();
});
$('prev').addEventListener('click', () => { weekOffset--; render(); });
$('next').addEventListener('click', () => { weekOffset++; render(); });
addEventListener('beforeunload', e => { if (dirty) e.preventDefault(); });

load();

// SOOP 쿠키에 문제가 있을 때만 알린다(바꾸기는 상태 화면에서)
fetch('/status.json', { cache: 'no-store' })
    .then(r => (r.ok ? r.json() : null))
    .then(st => {
        if (!st?.state || st.state === 'ok' || st.state === 'unknown') return;
        const box = $('cookie');
        box.hidden = false;
        box.className = 'cookie warn';
        box.innerHTML = `${st.state === 'none' ? 'SOOP 쿠키가 없어요' : 'SOOP 쿠키가 만료됐을 수 있어요'}. 즐겨찾기 전용 글이 최근 글 뱃지에 안 나와요. <a href="/status">상태에서 바꾸기 →</a>`;
    })
    .catch(() => {});
</script>
</body>
</html>
